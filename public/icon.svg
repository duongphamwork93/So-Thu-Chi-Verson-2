<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Soft inner glow circle -->
  <circle cx="256" cy="256" r="190" fill="#FFFFFF" fill-opacity="0.12" />

  <!-- Credit Card / Wallet Shape with shadow -->
  <g filter="url(#shadow)">
    <rect x="100" y="150" width="312" height="196" rx="28" fill="url(#cardGrad)" stroke="#FBCFE8" stroke-width="4" />
    
    <!-- Magnetic / Color Strip -->
    <rect x="100" y="195" width="312" height="42" fill="#BE185D" fill-opacity="0.85" />
    
    <!-- Chip Icon -->
    <rect x="135" y="260" width="48" height="38" rx="8" fill="#FBBF24" stroke="#D97706" stroke-width="2" />
    <line x1="159" y1="260" x2="159" y2="298" stroke="#D97706" stroke-width="1.5" />
    <line x1="135" y1="279" x2="183" y2="279" stroke="#D97706" stroke-width="1.5" />

    <!-- Card Brand Dots (Visa/Mastercard style) -->
    <circle cx="345" cy="285" r="18" fill="#EF4444" fill-opacity="0.85" />
    <circle cx="370" cy="285" r="18" fill="#F59E0B" fill-opacity="0.85" />
  </g>

  <!-- Golden Coin falling in with Sparkle -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="115" r="50" fill="url(#coinGrad)" stroke="#CA8A04" stroke-width="4" />
    <text x="256" y="132" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#854D0E" text-anchor="middle">₫</text>
  </g>

  <!-- Sparkles -->
  <path d="M 390 100 Q 390 120 410 120 Q 390 120 390 140 Q 390 120 370 120 Q 390 120 390 100 Z" fill="#FEF08A" />
  <path d="M 115 110 Q 115 125 130 125 Q 115 125 115 140 Q 115 125 100 125 Q 115 125 115 110 Z" fill="#FFFFFF" />
  <path d="M 380 370 Q 380 385 395 385 Q 380 385 380 400 Q 380 385 365 385 Q 380 385 380 370 Z" fill="#FDE047" />
</svg>
